# Blueprint do Render: Dashboard > New > Blueprint > escolha este repositório.
services:
  - type: web
    name: flask-detective
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    # Lê o gunicorn.conf.py: 1 worker + threads (as buscas ficam em memória)
    # Aplica as migrations do banco e sobe o servidor
    startCommand: flask --app app db upgrade && gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SEARCH_WORKERS
        value: "2"
      - key: SITE_TIMEOUT
        value: "15"
      - key: SECRET_KEY
        generateValue: true
      # Configure no painel: string de conexão do Postgres (SQLite no Render é apagado a cada deploy)
      - key: DATABASE_URL
        sync: false
